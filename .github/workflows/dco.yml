name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by: ' | grep -qiF "<${author_email}>"; then
              echo "::error::Commit $sha ($(git log -1 --format='%s' "$sha")) has no Signed-off-by line matching its author."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Every commit needs a Developer Certificate of Origin sign-off."
            echo "Fix it with: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
          echo "All commits are signed off."
